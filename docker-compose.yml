version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_careerguide_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_careerguide}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_careerguide}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_careerguide_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_careerguide_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_careerguide}
      - SECRET_KEY=${SECRET_KEY:-ai_careerguide_super_secret_jwt_key_2026_owasp_compliant}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ENVIRONMENT=development
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/seed_tt09.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - ai_careerguide_net

volumes:
  postgres_data:
    driver: local

networks:
  ai_careerguide_net:
    driver: bridge
